name: Store submission checks
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review again
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: store-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      STORE_RESULT: ${{ github.workspace }}/validation-result.json
    steps:
      - name: Validate PR number
        run: '[[ "$PR_NUMBER" =~ ^[0-9]+$ ]]'
      - name: Checkout trusted validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Checkout submission as data only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr_number }}/head
          path: submitted
          persist-credentials: false
      - name: Record reviewed commit
        run: echo "REVIEW_SHA=$(git -C submitted rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Test trusted validator
        run: python3 -I -m unittest discover -s trusted/scripts -p test_validator.py
      - name: Check submission files and published artifacts
        run: python3 -I trusted/scripts/validate.py submitted --verify-assets
      - name: Update PR review comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I trusted/scripts/comment.py
