name: Store submission checks
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review again
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: store-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      review_sha: ${{ steps.review.outputs.head }}
      base_sha: ${{ steps.review.outputs.base }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      STORE_RESULT: ${{ github.workspace }}/validation-result.json
    steps:
      - name: Validate PR number
        run: '[[ "$PR_NUMBER" =~ ^[0-9]+$ ]]'
      - name: Checkout trusted validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Checkout submission as data only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr_number }}/head
          path: submitted
          persist-credentials: false
      - name: Record reviewed commit
        id: review
        run: |
          echo "REVIEW_SHA=$(git -C submitted rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "head=$(git -C submitted rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "base=$(git -C trusted rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install trusted image validator
        run: |
          python3 -m venv .validator-env
          .validator-env/bin/python -I -m pip install Pillow==12.3.0
      - name: Prepare trusted Android APK inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aapt apksigner
          mkdir -p "$RUNNER_TEMP/android-inspection/lib"
          ln -s "$(command -v aapt)" "$RUNNER_TEMP/android-inspection/aapt"
          ln -s /usr/share/java/apksigner.jar "$RUNNER_TEMP/android-inspection/lib/apksigner.jar"
          echo "ANDROID_BUILD_TOOLS=$RUNNER_TEMP/android-inspection" >> "$GITHUB_ENV"
      - name: Test trusted validator
        run: .validator-env/bin/python -I -m unittest discover -s trusted/scripts -p 'test_*.py'
      - name: Check submission files and published artifacts
        run: .validator-env/bin/python -I trusted/scripts/validate.py submitted --generated-catalog --verify-assets
      - name: Check repository owner, release and update identity
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: .validator-env/bin/python -I trusted/scripts/repository_check.py submitted trusted
      - name: Update PR review comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I trusted/scripts/comment.py
  auto-update:
    name: Merge eligible package update
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      REVIEW_SHA: ${{ needs.validate.outputs.review_sha }}
      REVIEW_BASE_SHA: ${{ needs.validate.outputs.base_sha }}
    steps:
      - name: Checkout trusted update policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate.outputs.base_sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout validated package as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.validate.outputs.review_sha }}
          fetch-depth: 0
          path: submitted
          persist-credentials: false
      - name: Approve and queue an eligible existing-package update
        run: python3 -I trusted/scripts/auto_update.py trusted submitted
