name: Request package removal
description: Ask to remove your package from UltraBar Store.
title: '[Removal] '
labels: [removal-request]
body:
  - type: input
    id: package-id
    attributes:
      label: Package ID
      placeholder: publisher.package
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Explain why you want the listing removed. Do not include private information.
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I own the registered source repository and understand that removal does not uninstall existing copies.
          required: true
